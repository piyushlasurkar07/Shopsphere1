<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed – ShopSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5 text-center">
        <div class="card border-0 shadow-sm rounded-4 p-5 mx-auto" style="max-width: 580px;">
            <div class="d-inline-flex align-items-center justify-content-center bg-success text-white rounded-circle mb-3 mx-auto" style="width: 72px; height: 72px;">
                <i class="fa-solid fa-check fs-2"></i>
            </div>
            
            <h2 class="fw-bold text-navy mb-2">Order Confirmed!</h2>
            <p class="text-secondary mb-4">Thank you for shopping with ShopSphere. Your order has been placed into our automated processing pipeline.</p>

            <div class="bg-light p-3 rounded-3 mb-4 text-start border">
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted small">Order Number:</span>
                    <strong class="text-dark" id="disp-order-number">SS-...</strong>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted small">Tracking ID:</span>
                    <strong class="text-primary" id="disp-track-number">TRK-...</strong>
                </div>
                <div class="d-flex justify-content-between">
                    <span class="text-muted small">Status:</span>
                    <span class="badge bg-warning text-dark">Pending Processing</span>
                </div>
            </div>

            <div class="d-flex justify-content-center gap-3">
                <a href="/orders" class="btn btn-outline-primary fw-bold px-4 py-2 rounded-pill">
                    <i class="fa-solid fa-box me-1"></i> View Order History
                </a>
                <a href="/products" class="btn btn-primary fw-bold px-4 py-2 rounded-pill">
                    <i class="fa-solid fa-bag-shopping me-1"></i> Continue Shopping
                </a>
            </div>
        </div>
    </div>

    <script>
    const params = new URLSearchParams(window.location.search);
    const ord = params.get('order_number') || 'SS-PENDING';
    document.getElementById('disp-order-number').textContent = ord;
    document.getElementById('disp-track-number').textContent = 'TRK-' + ord;
    </script>
</body>
</html>
