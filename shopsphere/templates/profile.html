<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile – ShopSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

    <header class="main-header py-3 bg-white shadow-sm mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="/" class="brand-logo text-decoration-none">
                <i class="fa-solid fa-bag-shopping text-primary"></i>
                <span>ShopSphere<span class="brand-dot">.</span></span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <a href="/products" class="btn btn-outline-secondary btn-sm rounded-pill px-3"><i class="fa-solid fa-arrow-left me-1"></i> Storefront</a>
                <button onclick="logout()" class="btn btn-outline-danger btn-sm rounded-pill px-3">Sign Out</button>
            </div>
        </div>
    </header>

    <div class="container my-5" style="max-width: 640px;">
        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
            <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
                <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle fs-3" style="width: 64px; height: 64px;">
                    <i class="fa-regular fa-user"></i>
                </div>
                <div>
                    <h4 class="fw-bold text-navy mb-0" id="prof-header-name">Customer Account</h4>
                    <small class="text-muted" id="prof-header-email">Signed in</small>
                </div>
            </div>

            <form id="profile-form" onsubmit="handleUpdateProfile(event)">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Username</label>
                    <input type="text" id="prof-username" class="form-control bg-light" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Email Address</label>
                    <input type="email" id="prof-email" class="form-control bg-light" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Full Name *</label>
                    <input type="text" id="prof-fullname" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Mobile Phone</label>
                    <input type="tel" id="prof-phone" class="form-control" placeholder="10-digit number">
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold">Default Shipping Address</label>
                    <textarea id="prof-address" class="form-control" rows="3" placeholder="Street, City, Pincode"></textarea>
                </div>
                <button type="submit" id="prof-save-btn" class="btn btn-primary w-100 py-2 fw-bold rounded-pill shadow-sm">
                    Save Changes
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        fetch('/api/auth/me')
            .then(r => r.json())
            .then(d => {
                if (!d.authenticated) {
                    window.location.href = '/login';
                    return;
                }
                document.getElementById('prof-header-name').textContent = d.full_name;
                document.getElementById('prof-header-email').textContent = d.email;
                document.getElementById('prof-username').value = d.username;
                document.getElementById('prof-email').value = d.email;
                document.getElementById('prof-fullname').value = d.full_name;
                document.getElementById('prof-phone').value = d.phone || '';
                document.getElementById('prof-address').value = d.address || '';
            });
    });

    function handleUpdateProfile(e) {
        e.preventDefault();
        const btn = document.getElementById('prof-save-btn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Saving...';

        fetch('/api/auth/profile', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                full_name: document.getElementById('prof-fullname').value.trim(),
                phone: document.getElementById('prof-phone').value.trim(),
                address: document.getElementById('prof-address').value.trim()
            })
        })
        .then(r => r.json())
        .then(d => {
            btn.disabled = false;
            btn.innerHTML = 'Save Changes';
            if (d.success) {
                showToast('Profile updated successfully!', 'success');
            } else {
                showToast(d.message || 'Failed to update profile', 'error');
            }
        });
    }
    </script>
</body>
</html>
