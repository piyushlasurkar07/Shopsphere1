<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout – ShopSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

    <header class="main-header py-3 bg-white shadow-sm mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="/" class="brand-logo text-decoration-none">
                <i class="fa-solid fa-bag-shopping text-primary"></i>
                <span>ShopSphere<span class="brand-dot">.</span></span>
            </a>
            <div class="text-muted small"><i class="fa-solid fa-shield-halved text-success me-1"></i> 256-Bit SSL Encrypted Checkout</div>
        </div>
    </header>

    <div class="container my-4">
        <h4 class="fw-bold text-navy mb-4">Complete Your Order</h4>

        <div id="checkout-alert" class="alert alert-danger d-none py-2 small" role="alert"></div>

        <form id="checkout-form" onsubmit="handlePlaceOrder(event)">
            <div class="row g-4">
                <!-- Shipping Details -->
                <div class="col-lg-7">
                    <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
                        <h5 class="fw-bold text-navy mb-3">1. Shipping Information</h5>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Recipient Full Name *</label>
                            <input type="text" id="cust-name" class="form-control" required placeholder="Enter full name">
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Email Address *</label>
                                <input type="email" id="cust-email" class="form-control" required placeholder="Enter email">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Phone Number *</label>
                                <input type="tel" id="cust-phone" class="form-control" required placeholder="10-digit mobile">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Complete Street Address *</label>
                            <textarea id="cust-address" class="form-control" rows="3" required placeholder="House/Flat number, Street, Landmark, City, State, Pincode"></textarea>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm rounded-4 p-4">
                        <h5 class="fw-bold text-navy mb-3">2. Shipping &amp; Payment Method</h5>
                        
                        <!-- Urgent Order option -->
                        <div class="p-3 bg-light rounded-3 mb-3 border">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="is-urgent-check">
                                <label class="form-check-label fw-bold text-navy small" for="is-urgent-check">
                                    <i class="fa-solid fa-bolt text-warning me-1"></i> Express Priority Order (Processed first by C++ Priority Queue)
                                </label>
                                <small class="text-muted d-block mt-1">High-priority expedited packaging and order dispatch.</small>
                            </div>
                        </div>

                        <!-- Payment Options -->
                        <div class="d-flex flex-column gap-2 mb-3">
                            <label class="p-3 border rounded-3 d-flex align-items-center gap-3" style="cursor: pointer;">
                                <input type="radio" name="payment_method" value="Cash on Delivery" checked>
                                <div>
                                    <div class="fw-bold text-dark">Cash on Delivery (COD)</div>
                                    <small class="text-muted">Pay comfortably with cash or UPI upon package delivery.</small>
                                </div>
                            </label>
                            <label class="p-3 border rounded-3 d-flex align-items-center gap-3" style="cursor: pointer;">
                                <input type="radio" name="payment_method" value="UPI / Online Payment">
                                <div>
                                    <div class="fw-bold text-dark">UPI / Credit / Debit Card</div>
                                    <small class="text-muted">Direct online payment architecture.</small>
                                </div>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Order Summary Sidebar -->
                <div class="col-lg-5">
                    <div class="card border-0 shadow-sm rounded-4 p-4 sticky-top" style="top: 20px;">
                        <h5 class="fw-bold text-navy mb-3">Order Summary</h5>
                        <div id="checkout-items" class="d-flex flex-column gap-2 mb-3">
                            <!-- Items list -->
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-secondary">Subtotal</span>
                            <span class="fw-bold" id="checkout-subtotal">₹0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-secondary">Shipping</span>
                            <span id="checkout-shipping">₹0</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-4">
                            <span class="h5 fw-bold text-navy">Total Payable</span>
                            <span class="h5 fw-bold text-primary" id="checkout-total">₹0</span>
                        </div>
                        <button type="submit" id="place-order-btn" class="btn btn-primary w-100 py-3 fw-bold rounded-pill shadow-sm">
                            <i class="fa-solid fa-lock me-2"></i> Confirm &amp; Place Order
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // Pre-fill user data if logged in
        fetch('/api/auth/me')
            .then(r => r.json())
            .then(d => {
                if (d.authenticated) {
                    if (d.full_name) document.getElementById('cust-name').value = d.full_name;
                    if (d.email) document.getElementById('cust-email').value = d.email;
                    if (d.phone) document.getElementById('cust-phone').value = d.phone;
                    if (d.address) document.getElementById('cust-address').value = d.address;
                }
            }).catch(() => {});

        // Fetch Cart
        fetch('/api/cart')
            .then(r => r.json())
            .then(d => {
                if (!d.success || !d.items || d.items.length === 0) {
                    alert('Your cart is empty. Please add products before checking out.');
                    window.location.href = '/products';
                    return;
                }
                document.getElementById('checkout-subtotal').textContent = '₹' + d.subtotal.toLocaleString('en-IN');
                document.getElementById('checkout-shipping').textContent = d.shipping_fee > 0 ? '₹' + d.shipping_fee.toLocaleString('en-IN') : 'FREE';
                document.getElementById('checkout-total').textContent = '₹' + d.total.toLocaleString('en-IN');

                let html = '';
                d.items.forEach(it => {
                    html += `
                        <div class="d-flex justify-content-between align-items-center small py-1">
                            <div>
                                <span class="fw-bold">${it.product_name}</span>
                                <span class="text-muted ms-1">x${it.quantity}</span>
                            </div>
                            <span class="fw-semibold">₹${it.item_total.toLocaleString('en-IN')}</span>
                        </div>`;
                });
                document.getElementById('checkout-items').innerHTML = html;
            });
    });

    function handlePlaceOrder(e) {
        e.preventDefault();
        const alertBox = document.getElementById('checkout-alert');
        const btn = document.getElementById('place-order-btn');

        alertBox.classList.add('d-none');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Placing your order...';

        const paymentMethod = document.querySelector('input[name="payment_method"]:checked').value;
        const payload = {
            name: document.getElementById('cust-name').value.trim(),
            email: document.getElementById('cust-email').value.trim(),
            phone: document.getElementById('cust-phone').value.trim(),
            address: document.getElementById('cust-address').value.trim(),
            payment_method: paymentMethod,
            is_urgent: document.getElementById('is-urgent-check').checked
        };

        fetch('/api/orders/checkout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(r => r.json())
        .then(d => {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-lock me-2"></i> Confirm &amp; Place Order';
            if (d.success) {
                window.location.href = `/order-success?order_number=${d.order_number}`;
            } else {
                alertBox.textContent = d.message || 'Checkout failed.';
                alertBox.classList.remove('d-none');
            }
        })
        .catch(() => {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-lock me-2"></i> Confirm &amp; Place Order';
            alertBox.textContent = 'Server connection error during checkout.';
            alertBox.classList.remove('d-none');
        });
    }
    </script>
</body>
</html>
