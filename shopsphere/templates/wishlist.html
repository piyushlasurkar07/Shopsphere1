<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist – ShopSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

    <header class="main-header py-3 bg-white shadow-sm mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="/" class="brand-logo text-decoration-none">
                <i class="fa-solid fa-bag-shopping text-primary"></i>
                <span>ShopSphere<span class="brand-dot">.</span></span>
            </a>
            <a href="/products" class="btn btn-outline-secondary btn-sm rounded-pill px-3"><i class="fa-solid fa-arrow-left me-1"></i> Continue Shopping</a>
        </div>
    </header>

    <div class="container my-4">
        <h4 class="fw-bold text-navy mb-4"><i class="fa-solid fa-heart me-2 text-danger"></i> Saved Wishlist</h4>

        <div id="wishlist-loading" class="text-center py-5">
            <i class="fa-solid fa-spinner fa-spin fs-2 text-primary"></i>
            <p class="text-muted mt-2">Loading your wishlist...</p>
        </div>

        <div id="wishlist-empty" class="card border-0 shadow-sm rounded-4 p-5 text-center d-none">
            <i class="fa-regular fa-heart fs-1 text-muted mb-3 d-block"></i>
            <h5 class="fw-bold text-navy">Your Wishlist is Empty</h5>
            <p class="text-muted small mb-4">You haven't saved any products yet.</p>
            <a href="/products" class="btn btn-primary fw-bold px-4 py-2 rounded-pill mx-auto">
                <i class="fa-solid fa-bag-shopping me-2"></i> Browse Products
            </a>
        </div>

        <div id="wishlist-grid" class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4 d-none"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
    function loadWishlist() {
        fetch('/api/wishlist')
            .then(r => {
                if (r.status === 401) {
                    window.location.href = '/login';
                    return null;
                }
                return r.json();
            })
            .then(d => {
                document.getElementById('wishlist-loading').classList.add('d-none');
                if (!d || !d.success || !d.items || d.items.length === 0) {
                    document.getElementById('wishlist-empty').classList.remove('d-none');
                    document.getElementById('wishlist-grid').classList.add('d-none');
                    return;
                }

                document.getElementById('wishlist-empty').classList.add('d-none');
                const grid = document.getElementById('wishlist-grid');
                grid.classList.remove('d-none');

                let html = '';
                d.items.forEach(it => {
                    html += `
                        <div class="col">
                            <div class="product-card h-100 d-flex flex-column">
                                <div class="product-img-box">
                                    <a href="/product/${it.product_id}"><img src="${it.image_url}" alt="${it.product_name}"></a>
                                    <button class="wishlist-toggle-btn active" onclick="removeWishlistItem(${it.product_id})" title="Remove"><i class="fa-solid fa-trash text-danger"></i></button>
                                </div>
                                <div class="product-body p-3 d-flex flex-column flex-grow-1">
                                    <span class="product-brand small fw-bold text-muted">${it.product_brand}</span>
                                    <a href="/product/${it.product_id}" class="text-decoration-none text-dark"><h6 class="fw-bold my-1">${it.product_name}</h6></a>
                                    <div class="fw-bold text-navy my-2">₹${it.price.toLocaleString('en-IN')}</div>
                                    <button onclick="moveToCart(${it.product_id})" class="btn btn-outline-primary btn-sm rounded-pill mt-auto w-100 fw-bold">
                                        <i class="fa-solid fa-cart-shopping me-1"></i> Move to Cart
                                    </button>
                                </div>
                            </div>
                        </div>`;
                });
                grid.innerHTML = html;
            });
    }

    function removeWishlistItem(productId) {
        fetch('/api/wishlist/remove', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ product_id: productId })
        })
        .then(r => r.json())
        .then(() => {
            loadWishlist();
            updateCounters();
        });
    }

    function moveToCart(productId) {
        fetch('/api/wishlist/move-to-cart', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ product_id: productId })
        })
        .then(r => r.json())
        .then(d => {
            showToast('Moved to cart!', 'success');
            loadWishlist();
            updateCounters();
        });
    }

    document.addEventListener('DOMContentLoaded', loadWishlist);
    </script>
</body>
</html>
