<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products – ShopSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>

    <header class="main-header py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="/" class="brand-logo text-decoration-none">
                <i class="fa-solid fa-bag-shopping text-primary"></i>
                <span>ShopSphere<span class="brand-dot">.</span></span>
            </a>
            <div class="flex-grow-1 mx-4" style="max-width: 500px;">
                <form action="/products" method="GET" class="search-container">
                    <input type="text" name="q" id="search-q-input" class="form-control search-input" placeholder="Search products..." autocomplete="off">
                    <button type="submit" class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
                </form>
            </div>
            <div class="d-flex align-items-center gap-3">
                <a href="/wishlist" class="nav-action-btn"><i class="fa-regular fa-heart fs-5"></i><span class="badge-count wishlist-count-badge" style="display:none;">0</span></a>
                <a href="/cart" class="nav-action-btn"><i class="fa-solid fa-cart-shopping fs-5 text-primary"></i><span class="badge-count cart-count-badge" style="display:none;">0</span></a>
                <a href="/login" class="btn btn-outline-primary btn-sm fw-bold rounded-pill px-3">Account</a>
            </div>
        </div>
    </header>

    <div class="container my-4">
        <div class="row g-4">
            <!-- Sidebar Filters -->
            <div class="col-lg-3">
                <div class="card border-0 shadow-sm rounded-4 p-4">
                    <h6 class="fw-bold text-navy mb-3">Filter Catalog</h6>
                    
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted">Category</label>
                        <select id="filter-category" class="form-select form-select-sm" onchange="applyFilters()">
                            <option value="">All Categories</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted">Max Price (₹)</label>
                        <input type="range" class="form-range" id="filter-max-price" min="500" max="150000" step="500" value="150000" oninput="document.getElementById('max-price-val').textContent = '₹' + Number(this.value).toLocaleString('en-IN'); applyFilters()">
                        <div class="small text-muted d-flex justify-content-between">
                            <span>₹500</span>
                            <span id="max-price-val" class="fw-bold text-primary">₹150,000</span>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted">Sort By</label>
                        <select id="filter-sort" class="form-select form-select-sm" onchange="applyFilters()">
                            <option value="">Featured</option>
                            <option value="price_asc">Price: Low to High</option>
                            <option value="price_desc">Price: High to Low</option>
                            <option value="rating">Customer Rating</option>
                            <option value="newest">Newest Arrivals</option>
                        </select>
                    </div>

                    <button onclick="resetFilters()" class="btn btn-light btn-sm w-100 text-muted fw-semibold">Reset Filters</button>
                </div>
            </div>

            <!-- Products Grid -->
            <div class="col-lg-9">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0 text-navy" id="catalog-title">Catalog</h5>
                    <small class="text-muted" id="products-count-label">Loading products...</small>
                </div>

                <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4" id="products-catalog-grid">
                    <!-- Loaded dynamically via C++ Drogon API -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
    const urlParams = new URLSearchParams(window.location.search);
    const initialQ = urlParams.get('q') || '';
    const initialCat = urlParams.get('category_id') || '';

    if (initialQ) document.getElementById('search-q-input').value = initialQ;

    function loadCategories() {
        fetch('/api/categories')
            .then(r => r.json())
            .then(d => {
                if (d.success && d.categories) {
                    const select = document.getElementById('filter-category');
                    d.categories.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c.id;
                        opt.textContent = c.name;
                        if (c.id == initialCat) opt.selected = true;
                        select.appendChild(opt);
                    });
                }
            });
    }

    function applyFilters() {
        const cat = document.getElementById('filter-category').value;
        const maxP = document.getElementById('filter-max-price').value;
        const sort = document.getElementById('filter-sort').value;
        const q = document.getElementById('search-q-input').value.trim();

        let url = `/api/products?q=${encodeURIComponent(q)}&sort=${sort}`;
        if (cat) url += `&category_id=${cat}`;
        if (maxP && maxP < 150000) url += `&max_price=${maxP}`;

        fetch(url)
            .then(r => r.json())
            .then(d => {
                const grid = document.getElementById('products-catalog-grid');
                const countLbl = document.getElementById('products-count-label');
                
                if (!d.success || !d.products || d.products.length === 0) {
                    countLbl.textContent = '0 items found';
                    grid.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <div class="p-5 bg-light rounded-4 border">
                                <i class="fa-solid fa-magnifying-glass fs-2 text-muted mb-3 d-block"></i>
                                <h5 class="fw-bold text-navy">No Matching Products Found</h5>
                                <p class="text-muted small">Try adjusting your filters or search terms.</p>
                                <button onclick="resetFilters()" class="btn btn-outline-primary btn-sm rounded-pill px-3">Clear Filters</button>
                            </div>
                        </div>`;
                    return;
                }

                countLbl.textContent = `Showing ${d.products.length} products`;
                let html = '';
                d.products.forEach(p => {
                    html += `
                        <div class="col">
                            <div class="product-card h-100 d-flex flex-column">
                                <div class="product-img-box">
                                    <a href="/product/${p.id}">
                                        <img src="${p.image_url}" alt="${p.name}" loading="lazy">
                                    </a>
                                    ${p.discount_percent > 0 ? `<span class="badge-discount">${p.discount_percent}% OFF</span>` : ''}
                                    <button type="button" class="wishlist-toggle-btn" onclick="toggleWishlist(${p.id}, this)">
                                        <i class="fa-regular fa-heart"></i>
                                    </button>
                                </div>
                                <div class="product-body d-flex flex-column flex-grow-1 p-3">
                                    <span class="product-brand text-muted small fw-bold text-uppercase">${p.brand}</span>
                                    <a href="/product/${p.id}" class="text-decoration-none text-dark">
                                        <h3 class="product-title fs-6 fw-bold my-1">${p.name}</h3>
                                    </a>
                                    <div class="product-rating small my-1">
                                        <i class="fa-solid fa-star text-warning"></i>
                                        <span>${p.rating} (${p.review_count})</span>
                                    </div>
                                    <div class="product-price-box mt-auto pt-2 d-flex justify-content-between align-items-center">
                                        <div>
                                            <span class="product-price fw-bold text-navy fs-5">₹${p.price.toLocaleString('en-IN')}</span>
                                            ${p.original_price > p.price ? `<span class="product-original-price text-muted text-decoration-line-through small ms-1">₹${p.original_price.toLocaleString('en-IN')}</span>` : ''}
                                        </div>
                                        <button onclick="addToCart(${p.id})" class="btn btn-outline-primary btn-sm rounded-circle" title="Add to Cart">
                                            <i class="fa-solid fa-cart-plus"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                });
                grid.innerHTML = html;
            });
    }

    function resetFilters() {
        document.getElementById('filter-category').value = '';
        document.getElementById('filter-max-price').value = 150000;
        document.getElementById('max-price-val').textContent = '₹150,000';
        document.getElementById('filter-sort').value = '';
        document.getElementById('search-q-input').value = '';
        applyFilters();
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadCategories();
        applyFilters();
    });
    </script>
</body>
</html>
