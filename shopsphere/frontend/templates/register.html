<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account – ShopSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 mx-auto" style="max-width: 480px;">
        <div class="text-center mb-4">
            <a href="/" class="brand-logo text-decoration-none d-inline-block mb-2">
                <i class="fa-solid fa-bag-shopping text-primary"></i>
                <span>ShopSphere<span class="brand-dot">.</span></span>
            </a>
            <h1 class="h4 fw-bold text-navy">Create Your Account</h1>
            <p class="text-muted small">Join ShopSphere for seamless shopping and fast checkouts</p>
        </div>

        <div id="register-alert" class="alert alert-danger d-none py-2 small" role="alert"></div>

        <form id="customer-register-form" onsubmit="handleCustomerRegister(event)">
            <div class="mb-3">
                <label class="form-label small fw-semibold text-dark">Full Name *</label>
                <input type="text" id="reg-name" name="full_name" class="form-control" placeholder="Enter your full name" required>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-sm-6">
                    <label class="form-label small fw-semibold text-dark">Username *</label>
                    <input type="text" id="reg-username" name="username" class="form-control" placeholder="Choose username" required>
                </div>
                <div class="col-sm-6">
                    <label class="form-label small fw-semibold text-dark">Mobile Number</label>
                    <input type="tel" id="reg-phone" name="phone" class="form-control" placeholder="10-digit number">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold text-dark">Email Address *</label>
                <input type="email" id="reg-email" name="email" class="form-control" placeholder="Enter your email" required autocomplete="email">
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold text-dark">Password *</label>
                <input type="password" id="reg-password" name="password" class="form-control" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold text-dark">Delivery Address</label>
                <textarea id="reg-address" name="address" class="form-control" rows="2" placeholder="Street, City, Pincode"></textarea>
            </div>

            <button type="submit" id="reg-submit-btn" class="btn btn-primary w-100 py-2 fw-bold rounded-pill shadow-sm mt-2">
                Create Account
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <span class="text-muted small">Already have an account?</span>
            <a href="/login" class="small text-primary fw-bold text-decoration-none ms-1">Sign in here</a>
        </div>
    </div>
</div>

<script src="/static/js/main.js"></script>
<script>
function handleCustomerRegister(e) {
    e.preventDefault();
    const fullName = document.getElementById('reg-name').value.trim();
    const username = document.getElementById('reg-username').value.trim();
    const phone = document.getElementById('reg-phone').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    const address = document.getElementById('reg-address').value.trim();
    const alertBox = document.getElementById('register-alert');
    const submitBtn = document.getElementById('reg-submit-btn');

    alertBox.classList.add('d-none');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Creating account...';

    fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            full_name: fullName,
            username: username,
            phone: phone,
            email: email,
            password: password,
            address: address
        })
    })
    .then(r => r.json())
    .then(data => {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Create Account';
        if (data.success) {
            showToast('Account created successfully!', 'success');
            setTimeout(() => { window.location.href = '/'; }, 600);
        } else {
            alertBox.textContent = data.message || 'Registration failed.';
            alertBox.classList.remove('d-none');
        }
    })
    .catch(() => {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Create Account';
        alertBox.textContent = 'Server connection failed. Please try again.';
        alertBox.classList.remove('d-none');
    });
}
</script>
</body>
</html>
