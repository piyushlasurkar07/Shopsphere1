<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – ShopSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 mx-auto" style="max-width: 440px;">
        <div class="text-center mb-4">
            <a href="/" class="brand-logo text-decoration-none d-inline-block mb-2">
                <i class="fa-solid fa-bag-shopping text-primary"></i>
                <span>ShopSphere<span class="brand-dot">.</span></span>
            </a>
            <h1 class="h4 fw-bold text-navy">Welcome Back</h1>
            <p class="text-muted small">Sign in to access your orders, cart, and wishlist</p>
        </div>

        <div id="login-alert" class="alert alert-danger d-none py-2 small" role="alert"></div>

        <form id="customer-login-form" onsubmit="handleCustomerLogin(event)">
            <div class="mb-3">
                <label class="form-label small fw-semibold text-dark">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-regular fa-envelope text-muted"></i></span>
                    <input type="email" id="login-email" name="email" class="form-control border-start-0" placeholder="Enter your email" required autocomplete="email">
                </div>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                    <label class="form-label small fw-semibold text-dark mb-0">Password</label>
                    <a href="javascript:void(0)" onclick="alert('Please contact support to reset your password.')" class="small text-primary text-decoration-none">Forgot password?</a>
                </div>
                <div class="input-group mt-1">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                    <input type="password" id="login-password" name="password" class="form-control border-start-0" placeholder="Enter your password" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" id="login-submit-btn" class="btn btn-primary w-100 py-2 fw-bold rounded-pill shadow-sm mt-2">
                Sign In
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <span class="text-muted small">New to ShopSphere?</span>
            <a href="/register" class="small text-primary fw-bold text-decoration-none ms-1">Create an account</a>
        </div>
    </div>
</div>

<script src="/static/js/main.js"></script>
<script>
function handleCustomerLogin(e) {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const alertBox = document.getElementById('login-alert');
    const submitBtn = document.getElementById('login-submit-btn');

    alertBox.classList.add('d-none');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Signing in...';

    fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
    })
    .then(r => r.json())
    .then(data => {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Sign In';
        if (data.success) {
            showToast('Signed in successfully!', 'success');
            setTimeout(() => { window.location.href = '/'; }, 600);
        } else {
            alertBox.textContent = data.message || 'Invalid email or password.';
            alertBox.classList.remove('d-none');
        }
    })
    .catch(() => {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Sign In';
        alertBox.textContent = 'Server connection failed. Please try again.';
        alertBox.classList.remove('d-none');
    });
}
</script>
</body>
</html>
