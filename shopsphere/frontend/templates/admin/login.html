<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Authentication – ShopSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

<div class="card border-0 shadow-lg rounded-4 p-4 p-md-5" style="max-width: 440px; width: 100%;">
    <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center text-white rounded-circle mb-3" style="width: 58px; height: 58px; background-color: #0f172a;">
            <i class="fa-solid fa-shield-halved fs-3 text-primary"></i>
        </div>
        <h4 class="fw-bold text-navy mb-1">Back-Office Management</h4>
        <small class="text-muted">ShopSphere Administrative Portal</small>
    </div>

    <div id="admin-alert" class="alert alert-danger d-none py-2 small" role="alert"></div>

    <!-- 1. Normal Admin Login Form -->
    <div id="login-container">
        <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
            <div class="mb-3">
                <label class="form-label small fw-semibold text-dark">Admin Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-regular fa-envelope text-muted"></i></span>
                    <input type="email" id="admin-email" name="email" class="form-control border-start-0" placeholder="Enter admin email" required autocomplete="email">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold text-dark">Security Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                    <input type="password" id="admin-password" name="password" class="form-control border-start-0" placeholder="Enter admin password" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" id="admin-login-btn" class="btn btn-primary w-100 py-2 fw-bold rounded-3 shadow-sm">
                <i class="fa-solid fa-key me-2"></i> Authenticate
            </button>
        </form>
    </div>

    <!-- 2. One-Time Protected Admin Initialization (Visible ONLY if zero admins exist in database) -->
    <div id="setup-container" class="d-none">
        <div class="alert alert-warning small py-2 mb-3">
            <i class="fa-solid fa-triangle-exclamation me-1"></i> No administrator registered. Complete one-time initial setup below:
        </div>
        <form id="admin-setup-form" onsubmit="handleAdminSetup(event)">
            <div class="mb-2">
                <label class="form-label small fw-semibold text-dark">Full Name</label>
                <input type="text" id="setup-fullname" class="form-control form-control-sm" placeholder="e.g. System Administrator" required>
            </div>
            <div class="mb-2">
                <label class="form-label small fw-semibold text-dark">Admin Username</label>
                <input type="text" id="setup-username" class="form-control form-control-sm" placeholder="choose username" required>
            </div>
            <div class="mb-2">
                <label class="form-label small fw-semibold text-dark">Admin Email</label>
                <input type="email" id="setup-email" class="form-control form-control-sm" placeholder="admin email address" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold text-dark">Admin Password (min 8 chars)</label>
                <input type="password" id="setup-password" class="form-control form-control-sm" placeholder="create secure password" minlength="8" required>
            </div>
            <button type="submit" id="admin-setup-btn" class="btn btn-success w-100 py-2 fw-bold rounded-3 shadow-sm">
                <i class="fa-solid fa-user-shield me-2"></i> Create Super Administrator
            </button>
        </form>
    </div>

    <div class="text-center mt-4 pt-3 border-top">
        <a href="/" class="small text-muted text-decoration-none">
            <i class="fa-solid fa-arrow-left me-1"></i> Return to Public Storefront
        </a>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // Check if initial setup is required
    fetch('/api/admin/setup-status')
        .then(r => r.json())
        .then(d => {
            if (d.setup_required) {
                document.getElementById('login-container').classList.add('d-none');
                document.getElementById('setup-container').classList.remove('d-none');
            }
        }).catch(() => {});
});

function handleAdminLogin(e) {
    e.preventDefault();
    const email = document.getElementById('admin-email').value.trim();
    const password = document.getElementById('admin-password').value;
    const alertBox = document.getElementById('admin-alert');
    const btn = document.getElementById('admin-login-btn');

    alertBox.classList.add('d-none');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Verifying...';

    fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
    })
    .then(r => r.json())
    .then(data => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-key me-2"></i> Authenticate';
        if (data.success) {
            window.location.href = '/admin/dashboard';
        } else {
            alertBox.textContent = data.message || 'Invalid administrator credentials.';
            alertBox.classList.remove('d-none');
        }
    })
    .catch(() => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-key me-2"></i> Authenticate';
        alertBox.textContent = 'Server connection failed.';
        alertBox.classList.remove('d-none');
    });
}

function handleAdminSetup(e) {
    e.preventDefault();
    const fullName = document.getElementById('setup-fullname').value.trim();
    const username = document.getElementById('setup-username').value.trim();
    const email = document.getElementById('setup-email').value.trim();
    const password = document.getElementById('setup-password').value;
    const alertBox = document.getElementById('admin-alert');
    const btn = document.getElementById('admin-setup-btn');

    alertBox.classList.add('d-none');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Initializing...';

    fetch('/api/admin/setup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            full_name: fullName,
            username: username,
            email: email,
            password: password
        })
    })
    .then(r => r.json())
    .then(data => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-user-shield me-2"></i> Create Super Administrator';
        if (data.success) {
            alert('Admin initialized successfully! Please log in.');
            window.location.reload();
        } else {
            alertBox.textContent = data.message || 'Setup failed.';
            alertBox.classList.remove('d-none');
        }
    })
    .catch(() => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-user-shield me-2"></i> Create Super Administrator';
        alertBox.textContent = 'Server connection failed.';
        alertBox.classList.remove('d-none');
    });
}
</script>
</body>
</html>
